<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings · StudyNest</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script>
<script defer src="database.js"></script><script defer src="app.js"></script></head>
<body class="app-body"><div class="app-shell"><aside class="sidebar" id="sidebar">
<a class="brand" href="index.html"><span class="brand-mark">▣</span>StudyNest</a><nav class="side-nav"><a class="" href="dashboard.html"><span>⌂</span>Dashboard</a><a class="" href="courses.html"><span>▤</span>My Courses</a><a class="" href="tasks.html"><span>✓</span>Tasks</a><a class="" href="notes.html"><span>✎</span>Notes</a><a class="" href="progress.html"><span>◔</span>Progress</a><a class="active" href="settings.html"><span>⚙</span>Settings</a></nav>
<div class="side-bottom"><button class="btn btn-danger" style="width:100%" data-logout>Log out</button></div></aside>
<main class="app-main"><header class="app-topbar"><button class="icon-btn mobile-menu-btn" data-toggle-sidebar>☰</button>
<h1>Settings</h1><input class="input search" placeholder="Search workspace"><div class="profile-chip"><span class="avatar" data-user-initial>S</span><strong data-user-name>Student</strong></div></header>
<div class="app-content"><div id="setupRequired" class="card panel" hidden><strong>Supabase setup required.</strong> Add your project URL and anon key to config.js.</div>
<div class="page-head"><div><h1>Settings</h1><p>Manage your real account information and preferences.</p></div></div>
<div class="content-grid"><article class="card panel"><div class="panel-head"><h2>Profile</h2><span class="badge">Plan: <b id="currentPlan">STARTER</b></span></div>
<form id="profileSettingsForm" class="form"><div class="field"><label>Full name</label><input class="input" name="full_name" required></div>
<div class="field"><label>Email</label><input class="input" name="email" data-user-email disabled></div>
<div class="field"><label>School or organization</label><input class="input" name="school"></div><button class="btn btn-primary">Save changes</button></form></article>
<article class="card panel"><div class="panel-head"><h2>Preferences</h2></div><form id="preferencesForm" class="form">
<label><input id="prefWeekly" type="checkbox"> Weekly progress email</label><label><input id="prefTasks" type="checkbox"> Task reminders</label>
<button class="btn btn-secondary">Update preferences</button></form></article></div></div>
</main></div><div id="toast" hidden></div></body></html>
