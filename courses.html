<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Courses · StudyNest</title><link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script>
<script defer src="database.js"></script><script defer src="app.js"></script></head>
<body class="app-body"><div class="app-shell"><aside class="sidebar" id="sidebar">
<a class="brand" href="index.html"><span class="brand-mark">▣</span>StudyNest</a><nav class="side-nav"><a class="" href="dashboard.html"><span>⌂</span>Dashboard</a><a class="active" href="courses.html"><span>▤</span>My Courses</a><a class="" href="tasks.html"><span>✓</span>Tasks</a><a class="" href="notes.html"><span>✎</span>Notes</a><a class="" href="progress.html"><span>◔</span>Progress</a><a class="" href="settings.html"><span>⚙</span>Settings</a></nav>
<div class="side-bottom"><button class="btn btn-danger" style="width:100%" data-logout>Log out</button></div></aside>
<main class="app-main"><header class="app-topbar"><button class="icon-btn mobile-menu-btn" data-toggle-sidebar>☰</button>
<h1>My Courses</h1><input class="input search" placeholder="Search workspace"><div class="profile-chip"><span class="avatar" data-user-initial>S</span><strong data-user-name>Student</strong></div></header>
<div class="app-content"><div id="setupRequired" class="card panel" hidden><strong>Supabase setup required.</strong> Add your project URL and anon key to config.js.</div>
<div class="page-head"><div><h1>My Courses</h1><p>Create courses and update your progress.</p></div><button class="btn btn-primary" data-open-modal="courseModal">+ Add course</button></div>
<div class="course-grid" id="courseGrid"></div>
<div class="modal" id="courseModal"><div class="modal-card"><div class="modal-head"><h2>Course</h2><button class="icon-btn" data-close-modal="courseModal">×</button></div>
<form id="courseForm" class="form"><input type="hidden" name="id"><div class="field"><label>Title</label><input class="input" name="title" required maxlength="120"></div>
<div class="field"><label>Description</label><textarea class="input" name="description"></textarea></div><div class="form-row">
<div class="field"><label>Icon</label><input class="input" name="icon" placeholder="📘"></div>
<div class="field"><label>Progress (0–100)</label><input class="input" name="progress" type="number" min="0" max="100" value="0"></div></div>
<button class="btn btn-primary">Save course</button></form></div></div></div>
</main></div><div id="toast" hidden></div></body></html>
